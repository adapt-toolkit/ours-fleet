version: 1
description: Shared specialists and one independent reviewer per room
participants:
  architect:
    agent_template: Architect
    instance_scope: layout
  developer:
    agent_template: Developer
  reviewer:
    agent_template: Reviewer
    instance_scope: room
rooms:
  product:
    goal: Agree on the problem and acceptance criteria
    members: [architect, reviewer]
  design:
    goal: Design the accepted solution
    members: [architect, developer, reviewer]
  delivery:
    goal: Implement and verify the accepted design
    members: [developer, reviewer]
